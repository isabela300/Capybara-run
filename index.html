<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Capybara Run VR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: full-bleed 3D jungle canvas; floating score at top, one centered "trailhead sign" panel, thumb pad at bottom on touch screens */
:root{
  --jungle:#0d2419; --canopy:#1d4a2f; --leaf:#7cc46a; --mango:#f4a63b; --cream:#f6ead2; --bark:#4a2f1c;
  --display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Nunito',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--jungle);color:var(--cream);font-family:var(--body);overflow:hidden;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));
  font-family:var(--display);font-size:1.6rem;letter-spacing:.06em;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.35);display:flex;gap:18px}
#hud .hi{color:var(--mango);opacity:.85}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));
  background:var(--bark);border:3px solid #6b4529;border-radius:10px;padding:22px 22px 20px;
  box-shadow:0 10px 0 #2b1a0f,0 20px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:14px}
#panel h1{font-family:var(--display);font-weight:400;font-size:2.5rem;line-height:1;margin:0;color:var(--mango);text-wrap:balance}
#panel .sub{margin:0;font-weight:700;opacity:.8}
#moves{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#moves li{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:baseline;font-size:.95rem}
#moves b{font-family:var(--display);font-weight:400;letter-spacing:.04em;color:var(--leaf);text-transform:uppercase;font-size:.85rem}
#moves span{min-width:0}
kbd{font-family:var(--body);font-weight:800;background:#2b1a0f;border-radius:4px;padding:1px 6px;font-size:.8rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font-family:var(--display);font-size:1.15rem;letter-spacing:.04em;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;
  background:var(--mango);color:#3a2210;box-shadow:0 4px 0 #a8661a;flex:1 1 140px}
button.alt{background:var(--leaf);color:#14301a;box-shadow:0 4px 0 #3f7a33}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #a8661a}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
#note{margin:0;font-size:.82rem;opacity:.75;min-height:1em}
#result{margin:0;font-family:var(--display);font-size:1.4rem}
#pad{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#pad .grp{display:flex;gap:10px;pointer-events:auto}
#pad button{flex:none;width:64px;height:64px;padding:0;font-size:1.5rem;background:rgba(246,234,210,.18);color:var(--cream);box-shadow:none;border:2px solid rgba(246,234,210,.35);touch-action:none}
@media (pointer:coarse){#pad{display:flex}}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>

</head>
<body>
<div id="stage"></div>
<div id="hud"><span class="hi" id="hi">HI 00000</span><span id="score">00000</span></div>

<div id="panel">
  <h1 id="ptitle">Capybara Run</h1>
  <p class="sub" id="psub">A morning sprint along the Amazon riverbank.</p>
  <p id="result" hidden></p>
  <ul id="moves">
    <li><b>Jump</b><span>over fallen logs. <kbd>Space</kbd> or really jump in VR</span></li>
    <li><b>Squat</b><span>under low branches. Hold <kbd>↓</kbd> or squat down</span></li>
    <li><b>Dodge</b><span>kapok trunks. <kbd>←</kbd> <kbd>→</kbd> or step sideways</span></li>
  </ul>
  <div class="row">
    <button id="play">Play</button>
    <button id="vr" class="alt" disabled>Enter VR</button>
  </div>
  <p id="note">Checking for a VR headset…</p>
</div>

<div id="pad">
  <div class="grp"><button id="tl" aria-label="Move left">◀</button><button id="tr" aria-label="Move right">▶</button></div>
  <div class="grp"><button id="td" aria-label="Squat">▼</button><button id="tj" aria-label="Jump">▲</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);

/* ---------- renderer & scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;
renderer.xr.setReferenceSpaceType('local-floor');
$('stage').appendChild(renderer.domElement);

const FOG=0x24533a;
const scene=new THREE.Scene();
scene.background=new THREE.Color(FOG);
scene.fog=new THREE.Fog(FOG,10,58);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.05,200);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xd9f0b8,0x2b1d10,0.95));
const sun=new THREE.DirectionalLight(0xffe7b0,0.75);sun.position.set(4,10,3);scene.add(sun);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:1,flatShading:true},o));

function speckTex(base,specks,n,stripe){
  const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,128,128);
  for(let i=0;i<n;i++){g.fillStyle=specks[i%specks.length];const s=1+Math.random()*3;g.fillRect(Math.random()*128,Math.random()*128,s,stripe?s*3:s);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
const grassTex=speckTex('#2f6a34',['#3d8040','#24552a','#4c9348'],900,true);grassTex.repeat.set(14,26);
const dirtTex=speckTex('#7a5232',['#8d6440','#5f3f25','#a07650'],700,false);dirtTex.repeat.set(2,30);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(70,120),new THREE.MeshStandardMaterial({map:grassTex,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.z=-50;scene.add(ground);
const path=new THREE.Mesh(new THREE.PlaneGeometry(5.2,120),new THREE.MeshStandardMaterial({map:dirtTex,roughness:1}));
path.rotation.x=-Math.PI/2;path.position.set(0,0.01,-50);scene.add(path);

/* river on the left bank */
const river=new THREE.Mesh(new THREE.PlaneGeometry(9,120),M(0x6e8a5a,{roughness:.35,metalness:.1,flatShading:false}));
river.rotation.x=-Math.PI/2;river.position.set(-10.5,0.02,-50);scene.add(river);

/* ---------- decor: rainforest walls ---------- */
const trunkM=M(0x5b3a22),leafMs=[M(0x2f7a3a),M(0x3f9145),M(0x24632f),M(0x568f2e)];
const decor=[];
function jungleTree(){
  const g=new THREE.Group();const h=rand(4,9);
  const t=new THREE.Mesh(new THREE.CylinderGeometry(rand(.15,.3),rand(.3,.5),h,6),trunkM);t.position.y=h/2;g.add(t);
  const n=2+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){const s=new THREE.Mesh(new THREE.IcosahedronGeometry(rand(1.2,2.4),0),leafMs[i%4]);
    s.position.set(rand(-1,1),h+rand(-.6,.8),rand(-1,1));s.scale.y=rand(.6,.9);g.add(s);}
  return g;
}
function palm(){
  const g=new THREE.Group();const h=rand(3,6);
  const t=new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,h,5),trunkM);t.position.y=h/2;t.rotation.z=rand(-.15,.15);g.add(t);
  for(let i=0;i<6;i++){const f=new THREE.Mesh(new THREE.ConeGeometry(.35,2.4,3),leafMs[1]);
    f.position.y=h;f.rotation.z=Math.PI/2.6;f.rotation.y=i*Math.PI/3;f.geometry.translate(0,1.2,0);g.add(f);}
  return g;
}
function fern(){
  const g=new THREE.Group();
  for(let i=0;i<5;i++){const f=new THREE.Mesh(new THREE.ConeGeometry(.25,1.1,3),leafMs[(i+2)%4]);f.geometry.translate(0,.55,0);
    f.rotation.z=.7;f.rotation.y=i*1.26;g.add(f);}
  return g;
}
for(let i=0;i<70;i++){
  const side=Math.random()<.5?-1:1;let x,obj;
  if(side<0){x=-rand(15.5,24);obj=jungleTree();}            // far side of the river
  else{x=rand(3.4,16);obj=Math.random()<.3?palm():jungleTree();}
  obj.position.set(x,0,rand(-75,8));obj.rotation.y=rand(0,6);scene.add(obj);decor.push(obj);
}
for(let i=0;i<40;i++){const f=fern();const side=Math.random()<.5?-1:1;
  f.position.set(side<0?-rand(3.2,5.6):rand(3,6),0,rand(-75,8));f.scale.setScalar(rand(.6,1.3));scene.add(f);decor.push(f);}
/* fireflies */
const ffGeo=new THREE.BufferGeometry();const ffPos=new Float32Array(90*3);
for(let i=0;i<90;i++){ffPos[i*3]=rand(-14,14);ffPos[i*3+1]=rand(.5,4);ffPos[i*3+2]=rand(-70,8);}
ffGeo.setAttribute('position',new THREE.BufferAttribute(ffPos,3));
const fireflies=new THREE.Points(ffGeo,new THREE.PointsMaterial({color:0xfff1a0,size:.09,fog:true}));scene.add(fireflies);

/* ---------- capybara (desktop third-person) ---------- */
function makeCapy(){
  const g=new THREE.Group();const fur=M(0x9a6338),dk=M(0x6b4226),black=M(0x1a120c);
  const body=new THREE.Mesh(new THREE.SphereGeometry(.5,12,9),fur);body.scale.set(.82,.64,1.18);body.position.y=.56;g.add(body);
  const head=new THREE.Mesh(new THREE.BoxGeometry(.48,.44,.56),fur);head.position.set(0,.82,-.72);g.add(head);
  const snout=new THREE.Mesh(new THREE.BoxGeometry(.44,.34,.26),dk);snout.position.set(0,.76,-1.06);g.add(snout);
  const nose=new THREE.Mesh(new THREE.BoxGeometry(.28,.07,.04),black);nose.position.set(0,.84,-1.2);g.add(nose);
  [-1,1].forEach(s=>{
    const e=new THREE.Mesh(new THREE.SphereGeometry(.045,6,5),black);e.position.set(s*.2,.93,-.86);g.add(e);
    const ear=new THREE.Mesh(new THREE.BoxGeometry(.1,.1,.06),dk);ear.position.set(s*.17,1.07,-.56);g.add(ear);
  });
  const orange=new THREE.Mesh(new THREE.SphereGeometry(.13,10,8),M(0xf39a2b,{flatShading:false,roughness:.6}));orange.position.set(0,1.17,-.68);g.add(orange);
  const legs=[];[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
    const l=new THREE.Mesh(new THREE.BoxGeometry(.16,.34,.16),dk);l.geometry.translate(0,-.17,0);l.position.set(sx*.25,.34,sz*.36);g.add(l);legs.push(l);});
  g.userData.legs=legs;return g;
}
const capy=makeCapy();scene.add(capy);

/* ---------- obstacles ---------- */
const barkM=M(0x6a4428),ringM=M(0xc49a68),vineM=M(0x3c7d32),mossM=M(0x4e9a3e),kapokM=M(0x8a7a66);
function makeLog(width){
  const g=new THREE.Group();
  const c=new THREE.Mesh(new THREE.CylinderGeometry(.22,.24,width,9),barkM);c.rotation.z=Math.PI/2;g.add(c);
  [-1,1].forEach(s=>{const r=new THREE.Mesh(new THREE.CircleGeometry(.21,9),ringM);r.position.x=s*width/2+s*.005;r.rotation.y=s*Math.PI/2;g.add(r);});
  for(let i=0;i<4;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.12,5,4),mossM);m.position.set(rand(-width/2,width/2),.18,rand(-.1,.1));m.scale.y=.5;g.add(m);}
  g.userData.y=.22;return g;
}
function makeBranch(width){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.13,.16,width+3,7),barkM);b.rotation.z=Math.PI/2+.04;b.position.y=.25;g.add(b);
  for(let i=0;i<7;i++){const x=rand(-width/2,width/2),len=rand(.15,.35);
    const v=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,len,4),vineM);v.position.set(x,.25-len/2,0);g.add(v);
    const lf=new THREE.Mesh(new THREE.IcosahedronGeometry(.16,0),leafMs[i%4]);lf.position.set(x,.25-len,0);g.add(lf);}
  for(let i=0;i<5;i++){const lf=new THREE.Mesh(new THREE.IcosahedronGeometry(rand(.25,.4),0),leafMs[i%4]);lf.position.set(rand(-width/2,width/2),.4,rand(-.15,.15));g.add(lf);}
  return g;
}
function makeKapok(){
  const g=new THREE.Group();
  const t=new THREE.Mesh(new THREE.CylinderGeometry(.28,.38,7,8),kapokM);t.position.y=3.5;g.add(t);
  for(let i=0;i<4;i++){const r=new THREE.Mesh(new THREE.BoxGeometry(.08,.7,.7),kapokM);r.position.y=.35;r.rotation.y=i*Math.PI/4+.4;g.add(r);}
  const can=new THREE.Mesh(new THREE.IcosahedronGeometry(2.2,0),leafMs[0]);can.position.y=7.2;can.scale.y=.55;g.add(can);
  return g;
}

/* ---------- HUD in VR (canvas texture) ---------- */
const hudCan=document.createElement('canvas');hudCan.width=512;hudCan.height=256;
const hudTex=new THREE.CanvasTexture(hudCan);
const vrHud=new THREE.Mesh(new THREE.PlaneGeometry(1.6,.8),new THREE.MeshBasicMaterial({map:hudTex,transparent:true,fog:false,depthWrite:false}));
vrHud.visible=false;scene.add(vrHud);
function drawVrHud(big,small){
  const g=hudCan.getContext('2d');g.clearRect(0,0,512,256);
  g.textAlign='center';g.fillStyle='rgba(13,36,25,.55)';g.fillRect(0,0,512,256);
  g.fillStyle='#f4a63b';g.font='bold 64px "Lilita One", sans-serif';g.fillText(big,256,110);
  g.fillStyle='#f6ead2';g.font='bold 34px Nunito, sans-serif';
  String(small).split('\n').forEach((l,i)=>g.fillText(l,256,170+i*40));
  hudTex.needsUpdate=true;
}

/* ---------- audio ---------- */
let actx=null;
function beep(f,d,type='square',v=.06){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),gn=actx.createGain();
  o.type=type;o.frequency.value=f;gn.gain.value=v;gn.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);
  o.connect(gn).connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}
}

/* ---------- game state ---------- */
let mode='desk', state='ready', speed=3, dist=0, spawnIn=1.5, overAt=0;
let hi=0;try{hi=+localStorage.getItem('capyRunHi')||0}catch(e){}
const pad=n=>String(n).padStart(5,'0');
$('hi').textContent='HI '+pad(hi);
const obs=[];
const desk={x:0,lane:0,y:0,vy:0,duck:false};
const vr={baseX:0,baseY:1.6,baseZ:0,samples:[],calibStart:0};
const laneW=()=>mode==='vr'?.8:1.6;

function head(){return camera.position;}
function airborne(){return mode==='vr'?head().y>vr.baseY+.09:desk.y>.3;}
function ducking(){return mode==='vr'?head().y<vr.baseY-.25:(desk.duck&&desk.y<.05);}
function sideX(){return mode==='vr'?head().x-vr.baseX:desk.x;}

function clearObs(){obs.forEach(o=>scene.remove(o.mesh));obs.length=0;}
function spawn(){
  const lw=laneW(),w=lw*3+.6,r=Math.random();let o;
  const vrOff=mode==='vr'?vr.baseX:0;
  if(r<.36){o={type:'log',mesh:makeLog(w)};o.mesh.position.set(vrOff,.22,0);}
  else if(r<.68){o={type:'branch',mesh:makeBranch(w)};
    const bottom=mode==='vr'?vr.baseY-.17:.72;o.mesh.position.set(vrOff,bottom-.12+.25,0);}
  else{const lane=Math.random()<.5?0:(Math.random()<.5?-1:1);o={type:'tree',lane,mesh:makeKapok()};o.mesh.position.set(vrOff+lane*lw,0,0);}
  o.z=-62;scene.add(o.mesh);obs.push(o);
}
function hits(o){
  if(o.type==='log')return !airborne();
  if(o.type==='branch')return !ducking();
  return Math.abs(sideX()-o.lane*laneW())<(mode==='vr'?.38:.8);
}

function start(){
  clearObs();dist=0;speed=mode==='vr'?4.5:7;spawnIn=1.4;state='running';
  desk.lane=0;desk.x=0;desk.y=0;desk.vy=0;
  $('panel').hidden=true;beep(660,.12);
}
function gameOver(){
  state='over';overAt=performance.now();beep(140,.4,'sawtooth',.08);
  const s=Math.floor(dist);if(s>hi){hi=s;try{localStorage.setItem('capyRunHi',hi)}catch(e){};$('hi').textContent='HI '+pad(hi);}
  $('ptitle').textContent='Bonk!';$('psub').textContent='The capybara needs a moment by the river.';
  $('result').hidden=false;$('result').textContent='Score '+s+(s>=hi&&s>0?' · new best':'');
  $('play').textContent='Run again';
  if(mode==='desk')$('panel').hidden=false;
  else drawVrHud('Bonk! '+s,'Best '+hi+'\nJump or pull trigger to run again');
}

/* ---------- input: desktop / touch ---------- */
function jump(){if(state!=='running'){if(state!=='running'&&performance.now()-overAt>500&&mode==='desk')start();return;}
  if(desk.y<=0.001){desk.vy=4.6;beep(520,.1);}}
function lane(d){if(state==='running')desk.lane=Math.max(-1,Math.min(1,desk.lane+d));}
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump();}
  else if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();desk.duck=true;}
  else if(['ArrowLeft','KeyA'].includes(e.code)){e.preventDefault();if(!e.repeat)lane(-1);}
  else if(['ArrowRight','KeyD'].includes(e.code)){e.preventDefault();if(!e.repeat)lane(1);}
});
addEventListener('keyup',e=>{if(['ArrowDown','KeyS'].includes(e.code))desk.duck=false;});
const tap=(id,fn)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();fn();});
tap('tj',jump);tap('tl',()=>lane(-1));tap('tr',()=>lane(1));
$('td').addEventListener('pointerdown',e=>{e.preventDefault();desk.duck=true;});
['pointerup','pointercancel','pointerleave'].forEach(ev=>$('td').addEventListener(ev,()=>desk.duck=false));
$('play').addEventListener('click',()=>{$('play').blur();start();});

/* ---------- VR session ---------- */
(async function(){
  let ok=false;
  try{ok=!!navigator.xr&&await navigator.xr.isSessionSupported('immersive-vr');}catch(e){}
  $('vr').disabled=!ok;
  $('note').textContent=ok?'Headset found. Clear a 2 × 2 m space before you start.':'Open this page in a VR headset browser (like Meta Quest) to play with your body.';
})();
$('vr').addEventListener('click',async()=>{
  try{
    const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});
    await renderer.xr.setSession(s);
    mode='vr';state='calibrate';clearObs();vr.samples=[];vr.calibStart=performance.now();
    capy.visible=false;vrHud.visible=true;$('panel').hidden=true;
    drawVrHud('Stand tall','Look straight ahead');
    s.addEventListener('select',()=>{if(state==='ready'||(state==='over'&&performance.now()-overAt>1200))start();});
    s.addEventListener('end',()=>{mode='desk';state='ready';clearObs();capy.visible=true;vrHud.visible=false;
      camera.position.set(0,0,0);camera.rotation.set(0,0,0);resetPanel();$('panel').hidden=false;onResize();});
  }catch(e){$('note').textContent='VR could not start here: '+(e.message||e)+'. Try opening the page directly in the headset browser.';}
});
function resetPanel(){$('ptitle').textContent='Capybara Run';$('psub').textContent='A morning sprint along the Amazon riverbank.';$('result').hidden=true;$('play').textContent='Play';}

/* ---------- loop ---------- */
let last=performance.now(),hudTick=0,t=0;
renderer.setAnimationLoop(()=>{
  const now=performance.now();const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;

  if(mode==='vr'){
    const h=head();
    if(state==='calibrate'){
      if(now-vr.calibStart>600)vr.samples.push([h.x,h.y,h.z]);
      if(now-vr.calibStart>2200&&vr.samples.length){
        const n=vr.samples.length;vr.baseX=vr.samples.reduce((a,s)=>a+s[0],0)/n;vr.baseY=vr.samples.reduce((a,s)=>a+s[1],0)/n;vr.baseZ=vr.samples.reduce((a,s)=>a+s[2],0)/n;
        state='ready';vrHud.position.set(vr.baseX,vr.baseY+.55,vr.baseZ-3.2);drawVrHud('Capybara Run','Jump for real to start!\nJump logs · squat branches · step past trees');
      }
    }else if(state==='ready'&&h.y>vr.baseY+.12)start();
    else if(state==='over'&&now-overAt>1200&&h.y>vr.baseY+.12)start();
  }

  const runSpeed=state==='running'?speed:state==='over'?0:2.5;
  if(state==='running'){
    speed=mode==='vr'?Math.min(10,4.5+dist*.006):Math.min(17,7+dist*.012);
    dist+=speed*dt;
    spawnIn-=dt;if(spawnIn<=0){spawn();spawnIn=rand(mode==='vr'?9:8,mode==='vr'?15:15)/speed;}
    const s=Math.floor(dist);$('score').textContent=pad(s);
    if(mode==='vr'&&(hudTick+=dt)>.25){hudTick=0;drawVrHud(pad(s),'Best '+pad(hi));}
    if(s>0&&s%100===0&&!obs._m){obs._m=s;beep(880,.08);beep(1180,.12);}
  }
  const pz=mode==='vr'?vr.baseZ:0;
  for(let i=obs.length-1;i>=0;i--){const o=obs[i];
    o.z+=runSpeed*dt;o.mesh.position.z=pz+o.z;
    if(state==='running'&&!o.done&&o.z>-.3&&o.z<.3&&hits(o)){o.done=true;gameOver();}
    if(o.z>.3)o.done=true;
    if(o.z>12){scene.remove(o.mesh);obs.splice(i,1);}
  }
  decor.forEach(d=>{d.position.z+=runSpeed*dt;if(d.position.z>9)d.position.z-=84;});
  for(let i=0;i<90;i++){ffPos[i*3+2]+=runSpeed*dt;if(ffPos[i*3+2]>9)ffPos[i*3+2]-=79;ffPos[i*3+1]+=Math.sin(t*2+i)*.004;}
  ffGeo.attributes.position.needsUpdate=true;
  grassTex.offset.y+=runSpeed*dt*26/120;dirtTex.offset.y+=runSpeed*dt*30/120;
  river.material.color.setHSL(.27,.2,.42+Math.sin(t*1.5)*.02);

  if(mode==='desk'){
    if(state==='running'){desk.vy-=13*dt;desk.y=Math.max(0,desk.y+desk.vy*dt);if(desk.y===0)desk.vy=0;}
    desk.x+=(desk.lane*1.6-desk.x)*Math.min(1,dt*12);
    capy.position.set(desk.x,desk.y,0);
    const squash=ducking()?.55:1;capy.scale.y+=(squash-capy.scale.y)*Math.min(1,dt*18);
    capy.rotation.z=(desk.lane*1.6-desk.x)*-.15;
    const run=state==='running'&&desk.y===0;
    capy.userData.legs.forEach((l,i)=>l.rotation.x=run?Math.sin(t*speed*1.6+(i%2?Math.PI:0)+(i>1?Math.PI/2:0))*.7:(desk.y>0?(i>1?.6:-.6):0));
    capy.position.y+=run?Math.abs(Math.sin(t*speed*1.6))*.05:0;
    camera.position.set(desk.x*.55,2.5,4.4);camera.lookAt(desk.x*.55,.6,-6);
  }
  renderer.render(scene,camera);
});

function onResize(){if(renderer.xr.isPresenting)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
addEventListener('resize',onResize);
})();
</script>
